{% set name = "geoapis" %}
{% set version = "0.3.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/geoapis-{{ version }}.tar.gz
  sha256: 29d198a43ea7ff577d398a208ca1c6dffacd5f640faa6b82e235d867d7816020

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - boto3
    - geopandas >=0.10
    - python >={{ python_min }}
    - python-dotenv
    - requests
    - tomli
    - tqdm

test:
  imports:
    - geoapis
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/geoapis/
  summary: A package for downloading geospatial data from web APIs.
  description: |
    geoapis is a Python package for simply downloading publicly available
    web-hosted geo-spatial data. It currently supports downloading LiDAR data
    from OpenTopography, and vector or raster data from the LINZ Data Service.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rosepearson
